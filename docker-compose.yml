services:
  a-share-analyst:
    build: .
    container_name: a-share-analyst
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: 8788
    ports:
      - "8787:8787"
      - "8788:8788"
    volumes:
      - ./server/config:/app/server/config
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
